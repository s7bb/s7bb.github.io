[project]
name = "s7bb-fetcher"
version = "0.9.1"
requires-python = ">=3.11"
dependencies = [
    "requests==2.33.1",
    "pydantic==2.7.4",
    "lxml==6.1.0",
    "apscheduler==3.10.4",
    "gitpython==3.1.50",
]

[project.scripts]
s7bb-fetch     = "s7bb_fetcher.cli:fetch"
s7bb-export    = "s7bb_fetcher.cli:export"
s7bb-preflight = "s7bb_fetcher.cli:preflight"
s7bb-service   = "s7bb_fetcher.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s7bb_fetcher"]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.4.8",
    "freezegun==1.5.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["s7bb_fetcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
