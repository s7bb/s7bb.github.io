name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "fetcher/**"
      - "site/**"
      - ".github/workflows/ci.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install deps
        run: uv sync --group dev
        working-directory: fetcher

      - name: Lint
        run: uv run ruff check src tests
        working-directory: fetcher

      - name: Test
        run: uv run pytest
        working-directory: fetcher

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: site

      - name: Lint
        run: npm run lint
        working-directory: site

      - name: Type-check + build
        run: npm run build
        working-directory: site

      - name: Test
        run: npm test
        working-directory: site

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build fetcher image
        uses: docker/build-push-action@v6
        with:
          context: fetcher
          file: fetcher/Dockerfile
          push: false
          load: true
          tags: s7bb-fetcher:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: |
          docker run --rm s7bb-fetcher:ci s7bb-fetch --help
          docker run --rm s7bb-fetcher:ci s7bb-export --help

      - name: Build site image
        run: docker build -t s7bb-site:ci site/

      - name: Test site entrypoint
        run: sh site/test-entrypoint.sh
