name: Build and deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/build-site.yml"
  schedule:
    - cron: "10 * * * *"  # after the VM's :00 hourly data push
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code + site
        uses: actions/checkout@v4

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: s7bb/s7bb-data
          ref: main
          path: data-src

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site
        env:
          GITHUB_PAGES: "1"

      - name: Stage data into dist
        run: |
          mkdir -p site/dist/data/archive
          cp data-src/latest.json site/dist/data/latest.json || true
          cp data-src/archive/*.json site/dist/data/archive/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
